# Named, remotely managed Cloudflare Tunnel. Configure Access and the public
# hostname in Cloudflare before starting this service.
services:
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set tunnel token in .env.cloudflare.local}
    depends_on:
      web:
        condition: service_healthy
    networks: [local]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
