# Optional public synthetic demo on a free personal Tailscale tailnet.
# Authentication and Funnel activation require an interactive Tailscale login.
services:
  api:
    restart: unless-stopped
  web:
    restart: unless-stopped
  tailscale:
    image: tailscale/tailscale:stable
    hostname: sat-sa-demo
    # Keep tailscaled alive during interactive login; containerboot otherwise
    # exits and rotates the one-time URL before a user can approve the device.
    entrypoint: [tailscaled]
    command: ["--tun=userspace-networking", "--statedir=/var/lib/tailscale", "--socket=/tmp/tailscaled.sock"]
    volumes:
      - sat-sa-tailscale-state:/var/lib/tailscale
    depends_on:
      web:
        condition: service_healthy
    networks: [local]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  sat-sa-tailscale-state:
