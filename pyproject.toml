[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-sa"
version = "0.1.0"
description = "Offline supervisory evidence foundation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "duckdb>=1.2,<2", "pyarrow>=19,<24", "pytz>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["apps/api", "analytics", "packages/analytics-contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
